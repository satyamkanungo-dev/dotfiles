# ==========================================
# GENERAL SETTINGS
# ==========================================
set -g prefix C-a
set -g mouse on
set -g base-index 1
setw -g pane-base-index 0
set -g status-position bottom
set -g status-interval 1
set -g set-clipboard on

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# ==========================================
# PLUGINS LIST
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'


# ==========================================
# CATPPUCCIN THEME SETTINGS 
# ==========================================
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text "#W"         
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_status "icon"
set -g @catppuccin_window_current_background "#{@thm_mauve}"

# ==========================================
# STATUS BAR LAYOUT 
# ==========================================
set -g status-left ""
set -g status-right ""
set -g status-right-length 100

# 1. Directory Module
#set -g status-right "#{E:@catppuccin_status_directory}"

# 2. Session Module
set -ag status-right "#{E:@catppuccin_status_session}"

# 3. Forced IST Time Pill
# This manually builds the pill: Left-Semi-Circle | Icon Block | Time Text
set -ag status-right "#[fg=#89b4fa,bg=default]#[fg=#1e1e2e,bg=#89b4fa,bold]󱑒 #[fg=#89b4fa,bg=#313244] #(TZ='Asia/Kolkata' date +%%H:%%M) "

# 4. CPU Pill
set -ag status-right "#[fg=#89b4fa,bg=#313244]#[fg=#1e1e2e,bg=#89b4fa,bold] #[fg=#89b4fa,bg=#313244] #{cpu_percentage} "


# ==========================================
# 6. INITIALIZE TPM
# ==========================================
run '~/.config/tmux/plugins/tpm/tpm'


# ==========================================
# floating panes
# ==========================================
bind -N "New shell" F { new-pane -c "#{pane_current_path}" -x 80% -y 70% -T scratch ; move-pane -P centre }
bind -N "lazygit" g { new-pane -c "#{pane_current_path}" -x 90% -y 90%  -T scratch lazygit; move-pane -P centre } 
bind -N "Session list" f { new-pane -c "#{pane_current_path}" -T scratch "~/.config/tmux/session-tree.sh"; move-pane -P centre } 
bind -N "Create session" C { new-pane -c "#{pane_current_path}" -T scratch "~/.config/tmux/create-session.sh"; move-pane -P centre } 
bind -N "file manager" C-r { new-pane -x 80% -y 80% -T scratch "spf"; move-pane -P centre }

